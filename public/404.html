<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HurrCut</title>
    <!--
      Single-page app redirect for GitHub Pages.
      When Pages serves a 404 for a deep link, this script re-encodes the
      path into the query string so index.html can restore it via history.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
